<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ESCAPE PV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg:#04070d; --panel:#0b1622; --line:#2c4763;
        --amber:#ff9d3c; --amber-soft:#ffb24d; --cyan:#4fd0e0; --green:#48e39a;
        --ink:#e8eef6; --muted:#8aa0b6;
        --display: "Chakra Petch", system-ui, sans-serif;
        --jp: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      }
      * { margin:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body { height:100%; }
      body { background:var(--bg); color:var(--ink); font-family:var(--jp); overscroll-behavior:none; user-select:none; }

      #stage { position:relative; width:100vw; max-width:56.25vh; margin:0 auto; aspect-ratio:9/16;
        background:#070c14 center/cover no-repeat; box-shadow:0 0 120px rgba(0,0,0,.7) inset; }

      .hotspot {
        position:absolute; cursor:pointer; border-radius:12px;
        background:radial-gradient(ellipse at center, rgba(255,178,77,.16), rgba(255,178,77,.04) 60%, transparent 75%);
        box-shadow:0 0 0 1px rgba(255,178,77,.22) inset;
        animation:hotspotPulse 2.4s ease-in-out infinite;
      }
      .hotspot:active { background:rgba(255,200,90,.28); }
      @keyframes hotspotPulse {
        0%,100% { box-shadow:0 0 0 1px rgba(255,178,77,.18) inset; }
        50% { box-shadow:0 0 0 1px rgba(255,178,77,.42) inset, 0 0 18px rgba(255,178,77,.18); }
      }
      .hotspot.debug { outline:1px dashed rgba(255,255,0,.7); background:rgba(255,255,0,.08); }

      /* inventory */
      #inventory { position:fixed; bottom:0; left:0; right:0; display:flex; gap:10px; padding:10px 12px;
        justify-content:center; background:linear-gradient(0deg, rgba(4,7,13,.95), rgba(4,7,13,.4)); z-index:20; }
      .inv-item { font-size:26px; width:54px; height:54px; display:flex; align-items:center; justify-content:center;
        border:1px solid var(--line); border-radius:12px; background:rgba(13,26,40,.85); cursor:pointer;
        transition:transform .12s, border-color .12s, box-shadow .12s; }
      .inv-item:active { transform:scale(.94); }
      .inv-item.selected { border-color:var(--amber); box-shadow:0 0 16px rgba(255,157,60,.4); transform:translateY(-4px); }

      /* toast */
      #toast { position:fixed; top:max(18px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%) translateY(-12px);
        background:rgba(8,14,22,.92); border:1px solid var(--line); padding:11px 18px; border-radius:10px;
        font-size:15px; letter-spacing:.02em; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
        max-width:88vw; text-align:center; z-index:60; backdrop-filter:blur(6px); }
      #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
      #toast.win { border-color:var(--green); color:var(--green); box-shadow:0 0 30px rgba(72,227,154,.3); }

      /* tutorial coach */
      #coach { position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(16px);
        width:min(88vw, 420px); background:linear-gradient(180deg, rgba(15,26,40,.97), rgba(9,17,28,.97));
        border:1px solid var(--amber); border-radius:14px; padding:14px 16px 12px; z-index:40;
        box-shadow:0 10px 40px rgba(0,0,0,.55), 0 0 24px rgba(255,157,60,.15); opacity:0; pointer-events:none;
        transition:opacity .3s, transform .3s; }
      #coach.show { opacity:1; transform:translateX(-50%) translateY(0); }
      #coach::after { content:""; position:absolute; left:50%; bottom:-9px; width:16px; height:16px;
        background:linear-gradient(135deg, transparent 50%, rgba(9,17,28,.97) 50%); border-right:1px solid var(--amber);
        border-bottom:1px solid var(--amber); transform:translateX(-50%) rotate(45deg); }
      #coach .coach-tag { font-family:var(--display); font-size:11px; letter-spacing:.22em; color:var(--amber-soft); text-transform:uppercase; }
      #coach .coach-text { margin-top:5px; font-size:15px; line-height:1.55; color:var(--ink); }
      #coach .coach-skip { display:block; margin-top:10px; margin-left:auto; font-family:var(--display);
        font-size:12px; letter-spacing:.1em; color:var(--muted); background:none; border:none; cursor:pointer;
        padding:4px; pointer-events:auto; }

      /* keypad */
      .kp-overlay { position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
        background:rgba(2,5,9,.74); backdrop-filter:blur(4px); animation:fade .2s ease; }
      @keyframes fade { from { opacity:0; } to { opacity:1; } }
      .kp-panel { width:min(82vw, 320px); background:linear-gradient(180deg,#16263a,#0a131e); border:1px solid var(--line);
        border-radius:20px; padding:20px; box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset; }
      .kp-panel.shake { animation:shake .42s; }
      @keyframes shake { 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }
      .kp-title { font-family:var(--display); font-size:12px; letter-spacing:.26em; color:var(--amber-soft);
        text-transform:uppercase; text-align:center; }
      .kp-display { margin:14px auto 18px; display:flex; gap:10px; justify-content:center; }
      .kp-slot { width:38px; height:52px; border-radius:8px; background:#06141c; border:1px solid #1d3a4a;
        display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:30px;
        font-weight:700; color:var(--cyan); box-shadow:0 0 12px rgba(79,208,224,.12) inset; }
      .kp-slot.filled { border-color:var(--cyan); text-shadow:0 0 12px rgba(79,208,224,.7); }
      .kp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
      .kp-key { aspect-ratio:1/1; border-radius:14px; border:1px solid var(--line);
        background:radial-gradient(circle at 50% 35%, #20344a, #0e1c2b); color:var(--ink);
        font-family:var(--display); font-size:26px; font-weight:600; cursor:pointer;
        display:flex; align-items:center; justify-content:center; transition:transform .08s, box-shadow .12s, border-color .12s; }
      .kp-key:active { transform:scale(.92); border-color:var(--amber); box-shadow:0 0 18px rgba(255,157,60,.45); }
      .kp-key.del { color:var(--muted); font-size:22px; }
      .kp-key.ok { color:var(--green); border-color:rgba(72,227,154,.4); }
      .kp-close { display:block; margin:16px auto 0; font-family:var(--display); font-size:12px; letter-spacing:.14em;
        color:var(--muted); background:none; border:none; cursor:pointer; padding:6px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="inventory"></div>
    <div id="toast"></div>
    <div id="coach">
      <span class="coach-tag">Tutorial</span>
      <p class="coach-text"></p>
      <button class="coach-skip" type="button">スキップ ✕</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
