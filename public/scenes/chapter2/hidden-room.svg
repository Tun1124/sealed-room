<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3c2c"/><stop offset="1" stop-color="#332618"/>
    </linearGradient>
    <radialGradient id="topLight" cx="0.5" cy="0.06" r="0.8">
      <stop offset="0" stop-color="#ffe6ad" stop-opacity="0.4"/><stop offset="1" stop-color="#ffe6ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.42" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.52"/>
    </radialGradient>
    <linearGradient id="floorW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e4428"/><stop offset="1" stop-color="#46321c"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.42"/><stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="safeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4853"/><stop offset="1" stop-color="#28323b"/>
    </linearGradient>
    <linearGradient id="safeDoor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5763"/><stop offset="0.5" stop-color="#39444e"/><stop offset="1" stop-color="#45525d"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#e7ecf1"/><stop offset="1" stop-color="#aab4be"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d6"/><stop offset="1" stop-color="#ffe98a"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1280" fill="url(#wallV)"/>
  <rect width="720" height="1280" fill="url(#topLight)"/>
  <!-- exposed brick / paneling hint -->
  <g stroke="#241a10" stroke-width="2" opacity="0.35">
    <line x1="0" y1="300" x2="720" y2="300"/><line x1="0" y1="520" x2="720" y2="520"/>
    <line x1="240" y1="0" x2="240" y2="900" opacity="0.5"/><line x1="480" y1="0" x2="480" y2="900" opacity="0.5"/>
  </g>
  <rect x="0" y="900" width="720" height="380" fill="url(#floorW)"/>
  <rect width="720" height="1280" fill="url(#vignette)"/>

  <!-- back arrow -->
  <g stroke="#e7d7b4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
    <polyline points="58,628 32,660 58,692"/>
  </g>

  <!-- wall safe (code lock) -->
  <rect x="266" y="420" width="190" height="190" rx="10" fill="url(#safeBody)" stroke="#1f272e" stroke-width="4"/>
  <rect x="282" y="436" width="158" height="158" rx="6" fill="url(#safeDoor)" stroke="#222b33" stroke-width="2"/>
  <rect x="282" y="436" width="158" height="10" fill="#5a6873" opacity="0.6"/>
  <!-- dial -->
  <circle cx="346" cy="515" r="34" fill="url(#dial)" stroke="#7d8893" stroke-width="3"/>
  <circle cx="346" cy="515" r="6" fill="#5a636d"/>
  <g stroke="#7d8893" stroke-width="2">
    <line x1="346" y1="487" x2="346" y2="495"/><line x1="374" y1="515" x2="366" y2="515"/>
    <line x1="346" y1="543" x2="346" y2="535"/><line x1="318" y1="515" x2="326" y2="515"/>
  </g>
  <line x1="346" y1="515" x2="346" y2="492" stroke="#2c343c" stroke-width="3" stroke-linecap="round"/>
  <!-- handle -->
  <rect x="396" y="500" width="14" height="30" rx="6" fill="#aab4be"/>
  <rect x="396" y="500" width="14" height="30" rx="6" fill="none" stroke="#7d8893" stroke-width="1"/>

  <!-- torn note half B (pickup) -->
  <g transform="rotate(7 524 700)">
    <ellipse cx="524" cy="772" rx="58" ry="9" fill="#000" opacity="0.3"/>
    <polygon points="472,640 576,646 576,762 478,766" fill="url(#paper)"/>
    <polygon points="472,640 482,662 470,682 482,704 472,726 482,746 478,766" fill="#e9cf63"/>
    <line x1="496" y1="676" x2="560" y2="676" stroke="#b08f3a" stroke-width="4" stroke-linecap="round"/>
    <line x1="496" y1="702" x2="548" y2="702" stroke="#b08f3a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
