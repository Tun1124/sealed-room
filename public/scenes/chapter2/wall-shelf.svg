<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7da"/><stop offset="0.62" stop-color="#e3d8c5"/><stop offset="1" stop-color="#d3c6ad"/>
    </linearGradient>
    <linearGradient id="cornerShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c8a6a" stop-opacity="0.5"/><stop offset="0.2" stop-color="#9c8a6a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cornerShadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#9c8a6a" stop-opacity="0.5"/><stop offset="0.2" stop-color="#9c8a6a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="topLight" cx="0.5" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#fff7e8" stop-opacity="0.55"/><stop offset="1" stop-color="#fff7e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.74">
      <stop offset="0.52" stop-color="#241a10" stop-opacity="0"/><stop offset="1" stop-color="#241a10" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="floorW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6976a"/><stop offset="1" stop-color="#977853"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#241a10" stop-opacity="0.34"/><stop offset="1" stop-color="#241a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f4c2a"/><stop offset="1" stop-color="#553a20"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3420"/><stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0d99a"/><stop offset="0.5" stop-color="#c9a44f"/><stop offset="1" stop-color="#e6c87f"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1280" fill="url(#wallV)"/>
  <rect width="720" height="1280" fill="url(#topLight)"/>
  <rect width="720" height="1280" fill="url(#cornerShade)"/>
  <rect width="720" height="1280" fill="url(#cornerShadeR)"/>
  <rect x="0" y="940" width="720" height="8" fill="#7c6038" opacity="0.7"/>
  <polygon points="0,948 720,948 720,1280 0,1280" fill="url(#floorW)"/>
  <rect width="720" height="1280" fill="url(#vignette)"/>

  <!-- attic hatch on the ceiling -->
  <rect x="262" y="30" width="196" height="104" rx="6" fill="#5c4226" stroke="#6f5234" stroke-width="3"/>
  <rect x="276" y="44" width="168" height="76" rx="4" fill="#4a3420"/>
  <rect x="286" y="52" width="148" height="8" fill="#3a2818"/>
  <circle cx="436" cy="82" r="7" fill="url(#brass)"/>

  <!-- bookcase (tap to inspect) -->
  <ellipse cx="360" cy="958" rx="200" ry="34" fill="url(#contact)"/>
  <rect x="190" y="250" width="340" height="710" rx="6" fill="url(#case)" stroke="#46301a" stroke-width="6"/>
  <rect x="214" y="274" width="292" height="662" fill="url(#back)"/>
  <g>
    <rect x="214" y="274" width="292" height="16" fill="#5c4226"/>
    <rect x="214" y="430" width="292" height="16" fill="#5c4226"/>
    <rect x="214" y="600" width="292" height="16" fill="#5c4226"/>
    <rect x="214" y="770" width="292" height="16" fill="#5c4226"/>
  </g>
  <!-- books (varied) -->
  <g>
    <rect x="232" y="300" width="22" height="124" fill="#8c3b34"/><rect x="256" y="308" width="20" height="116" fill="#3f6b57"/>
    <rect x="278" y="298" width="24" height="126" fill="#b08a3a"/><rect x="304" y="312" width="18" height="112" fill="#6a4f86"/>
    <rect x="324" y="302" width="24" height="122" fill="#39526e"/><rect x="350" y="310" width="20" height="114" fill="#8c3b34"/>
    <rect x="372" y="300" width="22" height="124" fill="#3f6b57"/><rect x="396" y="306" width="22" height="118" fill="#b08a3a"/>
    <rect x="420" y="298" width="20" height="126" fill="#6a4f86"/><rect x="442" y="308" width="24" height="116" fill="#39526e"/>
    <rect x="468" y="302" width="20" height="122" fill="#8c3b34"/>
    <rect x="236" y="458" width="120" height="130" fill="#5a4a86" opacity="0.0"/>
    <rect x="232" y="630" width="24" height="124" fill="#39526e"/><rect x="258" y="636" width="20" height="118" fill="#8c3b34"/>
    <rect x="280" y="628" width="22" height="126" fill="#3f6b57"/><rect x="304" y="640" width="24" height="114" fill="#b08a3a"/>
    <rect x="330" y="630" width="20" height="124" fill="#6a4f86"/>
  </g>
  <!-- decorative box on a shelf -->
  <rect x="372" y="640" width="110" height="110" rx="6" fill="#7c5530" stroke="#553a20" stroke-width="2"/>
  <circle cx="427" cy="695" r="10" fill="url(#brass)"/>

  <!-- turn arrows -->
  <g stroke="#5a4730" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <polyline points="50,612 24,644 50,676"/>
    <polyline points="670,612 696,644 670,676"/>
  </g>
</svg>
