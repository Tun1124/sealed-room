<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7da"/><stop offset="0.62" stop-color="#e3d8c5"/><stop offset="1" stop-color="#d3c6ad"/>
    </linearGradient>
    <linearGradient id="cornerShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c8a6a" stop-opacity="0.5"/><stop offset="0.22" stop-color="#9c8a6a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cornerShadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#9c8a6a" stop-opacity="0.5"/><stop offset="0.22" stop-color="#9c8a6a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="topLight" cx="0.5" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#fff7e8" stop-opacity="0.55"/><stop offset="1" stop-color="#fff7e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.74">
      <stop offset="0.52" stop-color="#241a10" stop-opacity="0"/><stop offset="1" stop-color="#241a10" stop-opacity="0.36"/>
    </radialGradient>
    <linearGradient id="floorW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6976a"/><stop offset="1" stop-color="#977853"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.0" r="0.9">
      <stop offset="0" stop-color="#e7d6b6" stop-opacity="0.55"/><stop offset="1" stop-color="#e7d6b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#241a10" stop-opacity="0.34"/><stop offset="1" stop-color="#241a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6f3f"/><stop offset="1" stop-color="#7c5530"/>
    </linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f4c2a"/><stop offset="1" stop-color="#553a20"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0d99a"/><stop offset="0.5" stop-color="#c9a44f"/><stop offset="1" stop-color="#e6c87f"/>
    </linearGradient>
    <radialGradient id="clockFace" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbf4e2"/><stop offset="1" stop-color="#e6dabd"/>
    </radialGradient>
  </defs>

  <!-- ===== ROOM ===== -->
  <rect width="720" height="1280" fill="url(#wallV)"/>
  <rect width="720" height="1280" fill="url(#topLight)"/>
  <rect width="720" height="1280" fill="url(#cornerShade)"/>
  <rect width="720" height="1280" fill="url(#cornerShadeR)"/>
  <rect x="0" y="900" width="720" height="8" fill="#7c6038" opacity="0.7"/>
  <polygon points="0,906 720,906 720,1280 0,1280" fill="url(#floorW)"/>
  <polygon points="0,906 720,906 720,1280 0,1280" fill="url(#floorGlow)"/>
  <g stroke="#6f5634" stroke-width="2" opacity="0.25">
    <line x1="150" y1="906" x2="-40" y2="1280"/><line x1="330" y1="906" x2="280" y2="1280"/>
    <line x1="430" y1="906" x2="500" y2="1280"/><line x1="600" y1="906" x2="800" y2="1280"/>
    <line x1="0" y1="1040" x2="720" y2="1040" opacity="0.6"/>
  </g>
  <rect width="720" height="1280" fill="url(#vignette)"/>

  <!-- rug on the floor (something hidden underneath) -->
  <ellipse cx="360" cy="1150" rx="210" ry="74" fill="#7a3b34"/>
  <ellipse cx="360" cy="1150" rx="210" ry="74" fill="none" stroke="#caa46a" stroke-width="5" opacity="0.7"/>
  <ellipse cx="360" cy="1150" rx="168" ry="56" fill="none" stroke="#e7d2a6" stroke-width="3" opacity="0.5"/>
  <ellipse cx="360" cy="1150" rx="96" ry="30" fill="#9c4a40"/>
  <g stroke="#e7d2a6" stroke-width="2" opacity="0.4">
    <line x1="220" y1="1150" x2="500" y2="1150"/><line x1="360" y1="1096" x2="360" y2="1204"/>
  </g>

  <!-- ceiling attic hatch (interactable once you have the brass key) -->
  <rect x="280" y="22" width="160" height="96" rx="6" fill="#5c4226" stroke="#6f5234" stroke-width="3"/>
  <rect x="292" y="34" width="136" height="72" rx="4" fill="#4a3420"/>
  <rect x="300" y="42" width="120" height="8" fill="#3a2818"/>
  <circle cx="410" cy="70" r="6" fill="url(#brass)"/>

  <!-- framed portrait (grandfather) with a scribble in the corner -->
  <rect x="432" y="196" width="96" height="176" rx="4" fill="url(#brass)" stroke="#a8842f" stroke-width="3"/>
  <rect x="446" y="210" width="68" height="148" fill="#33414c"/>
  <circle cx="480" cy="262" r="22" fill="#7c8a96"/>
  <path d="M452 348 q28 -44 56 0 z" fill="#6a7884"/>
  <text x="500" y="350" font-family="Chakra Petch, monospace" font-size="9" fill="#cdb89a" text-anchor="end">IV:XVIII</text>

  <!-- bookshelf (left) — rotates with the crank to reveal the hidden room -->
  <ellipse cx="112" cy="946" rx="92" ry="20" fill="url(#contact)"/>
  <rect x="40" y="356" width="150" height="584" rx="4" fill="url(#woodDark)" stroke="#46301a" stroke-width="3"/>
  <rect x="52" y="368" width="126" height="560" fill="#4a3420"/>
  <g>
    <rect x="52" y="368" width="126" height="14" fill="#5c4226"/>
    <rect x="52" y="500" width="126" height="14" fill="#5c4226"/>
    <rect x="52" y="640" width="126" height="14" fill="#5c4226"/>
    <rect x="52" y="780" width="126" height="14" fill="#5c4226"/>
  </g>
  <!-- books -->
  <g>
    <rect x="60" y="392" width="14" height="104" fill="#8c3b34"/><rect x="76" y="398" width="13" height="98" fill="#3f6b57"/>
    <rect x="91" y="390" width="15" height="106" fill="#b08a3a"/><rect x="108" y="400" width="12" height="96" fill="#6a4f86"/>
    <rect x="122" y="394" width="16" height="102" fill="#39526e"/><rect x="140" y="402" width="13" height="94" fill="#8c3b34"/>
    <rect x="60" y="528" width="13" height="112" fill="#3f6b57"/><rect x="75" y="534" width="15" height="106" fill="#b08a3a"/>
    <rect x="92" y="524" width="12" height="116" fill="#39526e"/><rect x="106" y="532" width="16" height="108" fill="#8c3b34"/>
    <rect x="124" y="528" width="13" height="112" fill="#6a4f86"/><rect x="139" y="536" width="14" height="104" fill="#3f6b57"/>
    <rect x="64" y="668" width="80" height="104" fill="#5a4a86" opacity="0.0"/>
  </g>

  <!-- pendulum wall clock (4-digit lock behind the face) -->
  <rect x="312" y="150" width="96" height="270" rx="14" fill="url(#woodDark)" stroke="#46301a" stroke-width="3"/>
  <rect x="324" y="162" width="72" height="120" rx="8" fill="#2e2014"/>
  <circle cx="360" cy="222" r="46" fill="url(#clockFace)" stroke="#b59a63" stroke-width="3"/>
  <circle cx="360" cy="222" r="3.4" fill="#3a2c18"/>
  <line x1="360" y1="222" x2="360" y2="196" stroke="#3a2c18" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="360" y1="222" x2="378" y2="230" stroke="#3a2c18" stroke-width="3.2" stroke-linecap="round"/>
  <g stroke="#7c6038" stroke-width="2">
    <line x1="360" y1="182" x2="360" y2="188"/><line x1="400" y1="222" x2="394" y2="222"/>
    <line x1="360" y1="262" x2="360" y2="256"/><line x1="320" y1="222" x2="326" y2="222"/>
  </g>
  <!-- pendulum -->
  <rect x="357" y="296" width="6" height="86" fill="url(#brass)"/>
  <circle cx="360" cy="392" r="16" fill="url(#brass)" stroke="#a8842f" stroke-width="2"/>

  <!-- desk (tap to inspect) -->
  <ellipse cx="362" cy="924" rx="180" ry="34" fill="url(#contact)"/>
  <polygon points="248,712 472,712 520,760 200,760" fill="url(#wood)" stroke="#6f4c2a" stroke-width="2"/>
  <polygon points="248,712 472,712 466,724 254,724" fill="#b98a52" opacity="0.5"/>
  <rect x="200" y="760" width="320" height="26" fill="url(#woodDark)"/>
  <rect x="214" y="786" width="40" height="150" fill="url(#woodDark)"/>
  <rect x="466" y="786" width="40" height="150" fill="url(#woodDark)"/>
  <rect x="300" y="786" width="160" height="120" rx="4" fill="#6f4c2a" stroke="#553a20" stroke-width="2"/>
  <rect x="316" y="804" width="128" height="40" rx="3" fill="#7c5530"/>
  <rect x="316" y="852" width="128" height="40" rx="3" fill="#7c5530"/>
  <!-- small lamp + book on desk -->
  <rect x="250" y="676" width="44" height="40" rx="6" fill="#3f6b57"/>
  <rect x="256" y="668" width="32" height="12" rx="3" fill="#2f5040"/>

  <!-- exit door (right) -->
  <ellipse cx="610" cy="946" rx="96" ry="20" fill="url(#contact)"/>
  <rect x="536" y="330" width="150" height="610" rx="5" fill="#cdb79a" stroke="#b09a78" stroke-width="3"/>
  <rect x="552" y="346" width="118" height="578" rx="4" fill="url(#wood)" stroke="#6f4c2a" stroke-width="2"/>
  <rect x="566" y="372" width="90" height="220" rx="6" fill="#00000018" stroke="#6f4c2a" stroke-width="2"/>
  <rect x="566" y="620" width="90" height="270" rx="6" fill="#00000018" stroke="#6f4c2a" stroke-width="2"/>
  <circle cx="572" cy="650" r="9" fill="url(#brass)"/>
</svg>
