<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7da"/><stop offset="0.62" stop-color="#e3d8c5"/><stop offset="1" stop-color="#d3c6ad"/>
    </linearGradient>
    <radialGradient id="topLight" cx="0.5" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#fff7e8" stop-opacity="0.5"/><stop offset="1" stop-color="#fff7e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.52" stop-color="#241a10" stop-opacity="0"/><stop offset="1" stop-color="#241a10" stop-opacity="0.36"/>
    </radialGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9794a"/><stop offset="1" stop-color="#8a6238"/>
    </linearGradient>
    <linearGradient id="deskFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5530"/><stop offset="1" stop-color="#5f3f22"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0d99a"/><stop offset="0.5" stop-color="#c9a44f"/><stop offset="1" stop-color="#e6c87f"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3b52"/><stop offset="1" stop-color="#5e2c3e"/>
    </linearGradient>
  </defs>

  <!-- room + desk surface -->
  <rect width="720" height="1280" fill="url(#wallV)"/>
  <rect width="720" height="1280" fill="url(#topLight)"/>
  <rect x="0" y="640" width="720" height="640" fill="url(#deskFront)"/>
  <polygon points="0,640 720,640 720,560 0,520" fill="url(#deskTop)"/>
  <polygon points="0,520 720,560 720,576 0,536" fill="#b98a52" opacity="0.45"/>
  <g stroke="#6f4c2a" stroke-width="2" opacity="0.3">
    <line x1="0" y1="700" x2="720" y2="700"/><line x1="0" y1="820" x2="720" y2="820"/><line x1="0" y1="960" x2="720" y2="960"/>
  </g>
  <rect width="720" height="1280" fill="url(#vignette)"/>

  <!-- back arrow -->
  <g stroke="#5a4730" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <polyline points="58,640 32,672 58,704"/>
  </g>

  <!-- photo frame (examine: 0409) -->
  <g transform="rotate(-4 200 470)">
    <ellipse cx="200" cy="556" rx="78" ry="14" fill="#000" opacity="0.18"/>
    <rect x="128" y="404" width="150" height="150" rx="6" fill="url(#brass)" stroke="#a8842f" stroke-width="3"/>
    <rect x="146" y="422" width="114" height="114" fill="#cfe0e8"/>
    <circle cx="184" cy="470" r="22" fill="#9fb6c2"/>
    <rect x="150" y="500" width="106" height="34" fill="#88a0ad"/>
    <rect x="210" y="436" width="34" height="48" rx="4" fill="#b6c8d2"/>
  </g>

  <!-- diary (examine, only meaningful after the drawer opened) -->
  <g transform="rotate(6 520 470)">
    <ellipse cx="520" cy="540" rx="86" ry="14" fill="#000" opacity="0.18"/>
    <rect x="446" y="410" width="150" height="120" rx="6" fill="url(#book)" stroke="#4a2233" stroke-width="2"/>
    <rect x="446" y="410" width="16" height="120" rx="6" fill="#5e2c3e"/>
    <rect x="470" y="430" width="110" height="8" rx="3" fill="#c9a44f" opacity="0.7"/>
    <rect x="470" y="452" width="86" height="6" rx="3" fill="#e7d9b8" opacity="0.5"/>
    <rect x="470" y="468" width="96" height="6" rx="3" fill="#e7d9b8" opacity="0.4"/>
  </g>

  <!-- drawer with keypad lock (puzzle) -->
  <rect x="262" y="724" width="196" height="240" rx="6" fill="#6f4c2a" stroke="#553a20" stroke-width="3"/>
  <rect x="276" y="738" width="168" height="212" rx="4" fill="#7c5530"/>
  <rect x="276" y="738" width="168" height="10" fill="#9c6f3f" opacity="0.6"/>
  <!-- drawer pull (right) -->
  <rect x="398" y="828" width="48" height="12" rx="6" fill="#caa46a"/>
  <!-- compact keypad lock (left of the drawer, not centered) -->
  <rect x="288" y="784" width="74" height="98" rx="10" fill="#222a32" stroke="#3a444e" stroke-width="2"/>
  <rect x="288" y="784" width="74" height="98" rx="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.10"/>
  <rect x="296" y="792" width="58" height="17" rx="3" fill="#0c252e"/>
  <text x="325" y="805" font-family="Chakra Petch, monospace" font-size="11" fill="#5fd6e6" text-anchor="middle" letter-spacing="4">----</text>
  <g fill="#cfd4da">
    <circle cx="308" cy="828" r="4.2"/><circle cx="325" cy="828" r="4.2"/><circle cx="342" cy="828" r="4.2"/>
    <circle cx="308" cy="846" r="4.2"/><circle cx="325" cy="846" r="4.2"/><circle cx="342" cy="846" r="4.2"/>
    <circle cx="308" cy="864" r="4.2"/><circle cx="325" cy="864" r="4.2"/><circle cx="342" cy="864" r="4.2"/>
  </g>
</svg>
