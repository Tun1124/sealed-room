<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf1"/><stop offset="1" stop-color="#d2d9e0"/>
    </linearGradient>
    <radialGradient id="roomlight" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c19c"/><stop offset="1" stop-color="#c2a479"/>
    </linearGradient>
    <linearGradient id="doorwood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdab7c"/><stop offset="0.5" stop-color="#bd9a66"/><stop offset="1" stop-color="#c6a373"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e3dc"/><stop offset="1" stop-color="#d2cdc2"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4e8ec"/><stop offset="0.5" stop-color="#9aa2ab"/><stop offset="1" stop-color="#cfd5db"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1280" fill="url(#wall)"/>
  <rect width="720" height="1280" fill="url(#roomlight)"/>
  <rect x="0" y="946" width="720" height="14" fill="#b7bcc2"/>
  <polygon points="0,960 720,960 720,1280 0,1280" fill="url(#floor)"/>

  <!-- right back arrow -->
  <rect x="600" y="596" width="76" height="112" rx="16" fill="#000000" opacity="0.08"/>
  <g stroke="#2f3b46" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
    <polyline points="630,620 658,652 630,684"/>
  </g>

  <!-- EXIT sign -->
  <rect x="286" y="116" width="148" height="44" rx="6" fill="#1f9d6b" stroke="#157a52" stroke-width="2"/>
  <text x="360" y="148" font-family="Chakra Petch, sans-serif" font-size="26" font-weight="700" fill="#eafff5" text-anchor="middle" letter-spacing="4">EXIT</text>

  <!-- door frame + slab -->
  <rect x="168" y="168" width="384" height="800" rx="4" fill="url(#frame)" stroke="#bdb8ad" stroke-width="2"/>
  <rect x="190" y="182" width="340" height="786" rx="3" fill="url(#doorwood)" stroke="#a8854f" stroke-width="2"/>
  <rect x="214" y="214" width="292" height="150" rx="6" fill="#00000018" stroke="#a8854f" stroke-width="2"/>
  <rect x="214" y="800" width="292" height="140" rx="6" fill="#00000018" stroke="#a8854f" stroke-width="2"/>

  <!-- lever handle -->
  <ellipse cx="476" cy="600" rx="16" ry="16" fill="url(#handle)"/>
  <rect x="446" y="594" width="34" height="12" rx="6" fill="url(#handle)"/>

  <!-- wall keypad lock (number pad) -->
  <rect x="306" y="556" width="108" height="214" rx="12" fill="#242c34" stroke="#3c4651" stroke-width="2"/>
  <rect x="318" y="568" width="84" height="26" rx="4" fill="#0d2730"/>
  <text x="360" y="588" font-family="Chakra Petch, monospace" font-size="16" fill="#5fd6e6" text-anchor="middle" letter-spacing="5">----</text>
  <g font-family="Chakra Petch, sans-serif" font-size="17" fill="#dfe4ea" text-anchor="middle">
    <g fill="#39434e"><rect x="322" y="606" width="24" height="24" rx="5"/><rect x="348" y="606" width="24" height="24" rx="5"/><rect x="374" y="606" width="24" height="24" rx="5"/>
      <rect x="322" y="636" width="24" height="24" rx="5"/><rect x="348" y="636" width="24" height="24" rx="5"/><rect x="374" y="636" width="24" height="24" rx="5"/>
      <rect x="322" y="666" width="24" height="24" rx="5"/><rect x="348" y="666" width="24" height="24" rx="5"/><rect x="374" y="666" width="24" height="24" rx="5"/>
      <rect x="348" y="696" width="24" height="24" rx="5"/></g>
    <text x="334" y="623">1</text><text x="360" y="623">2</text><text x="386" y="623">3</text>
    <text x="334" y="653">4</text><text x="360" y="653">5</text><text x="386" y="653">6</text>
    <text x="334" y="683">7</text><text x="360" y="683">8</text><text x="386" y="683">9</text>
    <text x="360" y="713">0</text>
  </g>
</svg>
