<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a111c"/><stop offset="0.55" stop-color="#0c1521"/><stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="green" cx="0.5" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#48e39a" stop-opacity="0.45"/><stop offset="0.5" stop-color="#1f9d6b" stop-opacity="0.1"/><stop offset="1" stop-color="#1f9d6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2c3c"/><stop offset="0.5" stop-color="#24394d"/><stop offset="1" stop-color="#162636"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>

  <rect width="720" height="1280" fill="url(#room)"/>
  <rect width="720" height="1280" fill="url(#green)"/>
  <polygon points="0,1010 720,1010 720,1280 0,1280" fill="#070c14"/>

  <!-- right back hint -->
  <rect x="586" y="450" width="120" height="520" rx="4" fill="#10202c" stroke="#26485a" stroke-width="2"/>
  <polygon points="628,612 650,634 628,656" fill="#4fd0e0" opacity="0.75"/>
  <text x="646" y="700" font-family="Chakra Petch, sans-serif" font-size="16" fill="#4fd0e0" opacity="0.7" text-anchor="middle">BACK</text>

  <!-- the exit door -->
  <rect x="150" y="210" width="360" height="800" rx="8" fill="url(#door)" stroke="#42607f" stroke-width="3"/>
  <rect x="178" y="250" width="304" height="320" rx="6" fill="#0e1c29" stroke="#2c4763" stroke-width="2"/>
  <rect x="178" y="690" width="304" height="280" rx="6" fill="#0e1c29" stroke="#2c4763" stroke-width="2"/>
  <!-- EXIT sign -->
  <rect x="276" y="150" width="168" height="46" rx="6" fill="#0c3b2e" stroke="#48e39a" stroke-width="1.5"/>
  <text x="360" y="183" font-family="Chakra Petch, sans-serif" font-size="28" font-weight="700" fill="#5cf0aa" text-anchor="middle" letter-spacing="4">EXIT</text>
  <!-- handle -->
  <rect x="196" y="600" width="14" height="80" rx="7" fill="#6f90b0"/>

  <!-- wall keypad lock (openPuzzle) -->
  <rect x="288" y="576" width="144" height="192" rx="12" fill="#091420" stroke="#ff9d3c" stroke-width="2.5"/>
  <rect x="304" y="592" width="112" height="36" rx="5" fill="#06222e"/>
  <text x="360" y="617" font-family="Chakra Petch, monospace" font-size="22" fill="#4fd0e0" text-anchor="middle" letter-spacing="6">----</text>
  <g fill="#ffb24d">
    <circle cx="320" cy="660" r="7"/><circle cx="360" cy="660" r="7"/><circle cx="400" cy="660" r="7"/>
    <circle cx="320" cy="694" r="7"/><circle cx="360" cy="694" r="7"/><circle cx="400" cy="694" r="7"/>
    <circle cx="320" cy="728" r="7"/><circle cx="360" cy="728" r="7"/><circle cx="400" cy="728" r="7"/>
  </g>

  <rect width="720" height="1280" fill="url(#vig)"/>
  <rect width="720" height="1280" filter="url(#grain)" opacity="0.5"/>
</svg>
