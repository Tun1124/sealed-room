<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/><stop offset="0.62" stop-color="#e2e7ed"/><stop offset="1" stop-color="#d3d9e1"/>
    </linearGradient>
    <linearGradient id="cornerShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb7c2" stop-opacity="0.5"/><stop offset="0.22" stop-color="#aeb7c2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cornerShadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#aeb7c2" stop-opacity="0.5"/><stop offset="0.22" stop-color="#aeb7c2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="topLight" cx="0.5" cy="0.04" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.44" r="0.74">
      <stop offset="0.55" stop-color="#1b2430" stop-opacity="0"/><stop offset="1" stop-color="#1b2430" stop-opacity="0.30"/>
    </radialGradient>
    <linearGradient id="floorV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd3da"/><stop offset="1" stop-color="#b3bac3"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.0" r="0.9">
      <stop offset="0" stop-color="#e6eaef" stop-opacity="0.7"/><stop offset="1" stop-color="#e6eaef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b424c" stop-opacity="0.32"/><stop offset="1" stop-color="#3b424c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doorwood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6b888"/><stop offset="0.5" stop-color="#c5a473"/><stop offset="1" stop-color="#cdad7d"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef0f3"/><stop offset="1" stop-color="#d7dbe1"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef1f4"/><stop offset="0.5" stop-color="#9aa2ab"/><stop offset="1" stop-color="#cfd5db"/>
    </linearGradient>
    <linearGradient id="exitSign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb47c"/><stop offset="1" stop-color="#179c66"/>
    </linearGradient>
  </defs>

  <!-- ===== ROOM ===== -->
  <rect width="720" height="1280" fill="url(#wallV)"/>
  <rect width="720" height="1280" fill="url(#topLight)"/>
  <rect width="720" height="1280" fill="url(#cornerShade)"/>
  <rect width="720" height="1280" fill="url(#cornerShadeR)"/>
  <rect x="0" y="828" width="720" height="6" fill="#aab1ba" opacity="0.7"/>
  <polygon points="0,832 720,832 720,1280 0,1280" fill="url(#floorV)"/>
  <polygon points="0,832 720,832 720,1280 0,1280" fill="url(#floorGlow)"/>
  <g stroke="#9aa2ac" stroke-width="2" opacity="0.18">
    <line x1="150" y1="832" x2="-40" y2="1280"/><line x1="320" y1="832" x2="250" y2="1280"/>
    <line x1="400" y1="832" x2="470" y2="1280"/><line x1="570" y1="832" x2="760" y2="1280"/>
  </g>
  <rect width="720" height="1280" fill="url(#vignette)"/>

  <!-- right back arrow -->
  <g stroke="#48535f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
    <polyline points="662,624 688,656 662,688"/>
  </g>

  <!-- ===== EXIT DOOR ===== -->
  <ellipse cx="360" cy="958" rx="208" ry="36" fill="url(#contact)"/>
  <!-- EXIT sign with soft glow -->
  <ellipse cx="360" cy="138" rx="120" ry="40" fill="#2bb47c" opacity="0.16"/>
  <rect x="286" y="112" width="148" height="48" rx="7" fill="url(#exitSign)" stroke="#0f7d50" stroke-width="2"/>
  <text x="360" y="145" font-family="Chakra Petch, sans-serif" font-size="26" font-weight="700" fill="#eafff5" text-anchor="middle" letter-spacing="4">EXIT</text>

  <!-- door frame + slab -->
  <rect x="166" y="172" width="388" height="800" rx="5" fill="url(#frame)" stroke="#c4c8cf" stroke-width="2"/>
  <rect x="190" y="186" width="340" height="786" rx="4" fill="url(#doorwood)" stroke="#a8854f" stroke-width="2"/>
  <rect x="190" y="186" width="340" height="6" fill="#f0dcb8" opacity="0.7"/>
  <!-- panels -->
  <rect x="214" y="216" width="292" height="150" rx="6" fill="#00000016" stroke="#a8854f" stroke-width="2"/>
  <rect x="214" y="216" width="292" height="150" rx="6" fill="none" stroke="#f0dcb8" stroke-width="1" opacity="0.4"/>
  <rect x="214" y="800" width="292" height="150" rx="6" fill="#00000016" stroke="#a8854f" stroke-width="2"/>
  <rect x="214" y="800" width="292" height="150" rx="6" fill="none" stroke="#f0dcb8" stroke-width="1" opacity="0.4"/>
  <!-- soft sheen down the slab -->
  <polygon points="206,200 250,200 214,958 196,958" fill="#ffffff" opacity="0.06"/>

  <!-- lever handle -->
  <ellipse cx="476" cy="606" rx="17" ry="17" fill="url(#handle)"/>
  <ellipse cx="476" cy="606" rx="17" ry="17" fill="none" stroke="#7e8893" stroke-width="1"/>
  <rect x="444" y="600" width="36" height="13" rx="6.5" fill="url(#handle)"/>

  <!-- wall keypad lock (number pad) -->
  <ellipse cx="360" cy="676" rx="64" ry="120" fill="#000000" opacity="0.05"/>
  <rect x="304" y="552" width="112" height="222" rx="14" fill="#222a32" stroke="#3a444e" stroke-width="2"/>
  <rect x="304" y="552" width="112" height="222" rx="14" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <rect x="318" y="566" width="84" height="26" rx="4" fill="#0c252e"/>
  <text x="360" y="586" font-family="Chakra Petch, monospace" font-size="16" fill="#5fd6e6" text-anchor="middle" letter-spacing="5">----</text>
  <g font-family="Chakra Petch, sans-serif" font-size="17" fill="#e2e6ea" text-anchor="middle">
    <g fill="#39434e">
      <rect x="322" y="606" width="24" height="24" rx="5"/><rect x="348" y="606" width="24" height="24" rx="5"/><rect x="374" y="606" width="24" height="24" rx="5"/>
      <rect x="322" y="636" width="24" height="24" rx="5"/><rect x="348" y="636" width="24" height="24" rx="5"/><rect x="374" y="636" width="24" height="24" rx="5"/>
      <rect x="322" y="666" width="24" height="24" rx="5"/><rect x="348" y="666" width="24" height="24" rx="5"/><rect x="374" y="666" width="24" height="24" rx="5"/>
      <rect x="348" y="696" width="24" height="24" rx="5"/>
    </g>
    <text x="334" y="623">1</text><text x="360" y="623">2</text><text x="386" y="623">3</text>
    <text x="334" y="653">4</text><text x="360" y="653">5</text><text x="386" y="653">6</text>
    <text x="334" y="683">7</text><text x="360" y="683">8</text><text x="386" y="683">9</text>
    <text x="360" y="713">0</text>
  </g>
</svg>
