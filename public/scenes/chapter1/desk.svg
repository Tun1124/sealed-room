<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a111c"/>
      <stop offset="0.55" stop-color="#0c1521"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="amber" cx="0.5" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#ffb24d" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ff8a2b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff8a2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <radialGradient id="note" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#fff0c2"/>
      <stop offset="1" stop-color="#e6bd5e"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223348"/>
      <stop offset="1" stop-color="#0e1a28"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3d54"/>
      <stop offset="0.5" stop-color="#1a293a"/>
      <stop offset="1" stop-color="#24364b"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>

  <rect width="720" height="1280" fill="url(#room)"/>
  <polygon points="300,0 420,0 580,560 140,560" fill="url(#amber)"/>
  <rect width="720" height="1280" fill="url(#amber)"/>

  <!-- emergency strip light -->
  <rect x="250" y="44" width="220" height="12" rx="6" fill="#ffce8a" opacity="0.9"/>
  <rect x="252" y="46" width="216" height="4" rx="2" fill="#fff4dc"/>

  <!-- floor -->
  <polygon points="0,980 720,980 720,1280 0,1280" fill="#070c14"/>
  <line x1="120" y1="980" x2="-40" y2="1280" stroke="#16263a" stroke-width="2" opacity="0.5"/>
  <line x1="600" y1="980" x2="760" y2="1280" stroke="#16263a" stroke-width="2" opacity="0.5"/>

  <!-- right locker (to cabinet) -->
  <rect x="566" y="470" width="150" height="470" rx="8" fill="url(#metal)" stroke="#3a516e" stroke-width="2"/>
  <line x1="641" y1="476" x2="641" y2="934" stroke="#0b131c" stroke-width="3"/>
  <rect x="600" y="690" width="10" height="40" rx="4" fill="#5c7c9c"/>
  <rect x="672" y="690" width="10" height="40" rx="4" fill="#5c7c9c"/>
  <polygon points="690,610 705,630 690,650" fill="#4fd0e0" opacity="0.7"/>

  <!-- left exit door (to door) -->
  <rect x="14" y="450" width="150" height="510" rx="4" fill="#10202c" stroke="#26485a" stroke-width="2"/>
  <rect x="40" y="496" width="96" height="30" rx="4" fill="#0c3b2e"/>
  <text x="88" y="518" font-family="Chakra Petch, sans-serif" font-size="20" font-weight="700" fill="#48e39a" text-anchor="middle" letter-spacing="2">EXIT</text>
  <rect x="40" y="690" width="8" height="44" rx="4" fill="#3ad0a0"/>
  <polygon points="30,610 15,630 30,650" fill="#4fd0e0" opacity="0.7"/>

  <!-- desk -->
  <rect x="60" y="640" width="600" height="60" rx="6" fill="url(#desk)" stroke="#33506f" stroke-width="1.5"/>
  <rect x="60" y="700" width="600" height="16" fill="#0a1420"/>
  <!-- monitor -->
  <rect x="300" y="470" width="180" height="120" rx="8" fill="#0c1622" stroke="#2c4763" stroke-width="3"/>
  <rect x="312" y="482" width="156" height="96" rx="3" fill="#0e1f2c"/>
  <rect x="376" y="590" width="28" height="44" fill="#1a2c40"/>
  <rect x="346" y="632" width="88" height="10" rx="5" fill="#1a2c40"/>

  <!-- glowing sticky note (examine) -->
  <g transform="rotate(-4 353 780)">
    <rect x="288" y="704" width="130" height="120" rx="4" fill="url(#note)"/>
    <rect x="288" y="704" width="130" height="120" rx="4" fill="none" stroke="#fff6da" stroke-width="1.5" opacity="0.6"/>
    <line x1="306" y1="736" x2="400" y2="736" stroke="#9a7b2e" stroke-width="3" stroke-linecap="round"/>
    <line x1="306" y1="760" x2="392" y2="760" stroke="#9a7b2e" stroke-width="3" stroke-linecap="round"/>
    <line x1="306" y1="784" x2="372" y2="784" stroke="#9a7b2e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- drawer unit with keypad lock (openPuzzle) -->
  <rect x="252" y="896" width="216" height="256" rx="8" fill="url(#desk)" stroke="#33506f" stroke-width="2"/>
  <rect x="270" y="916" width="180" height="64" rx="6" fill="#0d1a28" stroke="#2c4763" stroke-width="1.5"/>
  <rect x="332" y="940" width="56" height="8" rx="4" fill="#3a5b7a"/>
  <rect x="270" y="996" width="180" height="64" rx="6" fill="#0d1a28" stroke="#2c4763" stroke-width="1.5"/>
  <rect x="332" y="1020" width="56" height="8" rx="4" fill="#3a5b7a"/>
  <!-- mini keypad hint on lower drawer -->
  <rect x="296" y="1076" width="128" height="62" rx="8" fill="#091420" stroke="#ff9d3c" stroke-width="1.5"/>
  <g fill="#ffb24d">
    <circle cx="320" cy="1096" r="5"/><circle cx="360" cy="1096" r="5"/><circle cx="400" cy="1096" r="5"/>
    <circle cx="320" cy="1120" r="5"/><circle cx="360" cy="1120" r="5"/><circle cx="400" cy="1120" r="5"/>
  </g>

  <rect width="720" height="1280" fill="url(#vig)"/>
  <rect width="720" height="1280" filter="url(#grain)" opacity="0.5"/>
</svg>
