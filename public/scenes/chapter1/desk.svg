<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/><stop offset="0.62" stop-color="#e2e7ed"/><stop offset="1" stop-color="#d3d9e1"/>
    </linearGradient>
    <linearGradient id="cornerShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb7c2" stop-opacity="0.55"/><stop offset="0.22" stop-color="#aeb7c2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cornerShadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#aeb7c2" stop-opacity="0.4"/><stop offset="0.2" stop-color="#aeb7c2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="topLight" cx="0.5" cy="0.04" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.44" r="0.74">
      <stop offset="0.55" stop-color="#1b2430" stop-opacity="0"/><stop offset="1" stop-color="#1b2430" stop-opacity="0.30"/>
    </radialGradient>
    <linearGradient id="floorV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd3da"/><stop offset="1" stop-color="#b3bac3"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.0" r="0.9">
      <stop offset="0" stop-color="#e6eaef" stop-opacity="0.7"/><stop offset="1" stop-color="#e6eaef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b424c" stop-opacity="0.34"/><stop offset="1" stop-color="#3b424c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22"/><stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#f4f6f9"/><stop offset="1" stop-color="#e7ebf0"/>
    </linearGradient>
    <linearGradient id="deskEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/><stop offset="1" stop-color="#d3d9e0"/>
    </linearGradient>
    <linearGradient id="deskSideL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd5dd"/><stop offset="1" stop-color="#e3e7ec"/>
    </linearGradient>
    <linearGradient id="deskSideR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8dde3"/><stop offset="1" stop-color="#bcc3cc"/>
    </linearGradient>
    <linearGradient id="ped" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#e2e6eb"/>
    </linearGradient>
    <linearGradient id="pedSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4cad2"/><stop offset="1" stop-color="#d8dde3"/>
    </linearGradient>
    <linearGradient id="drawerFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#e7ebf0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe4e9"/><stop offset="0.5" stop-color="#aab2bb"/><stop offset="1" stop-color="#cfd5db"/>
    </linearGradient>
    <linearGradient id="legMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9edf1"/><stop offset="0.5" stop-color="#b7bec7"/><stop offset="1" stop-color="#d2d8de"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.36" cy="0.3" r="1.0">
      <stop offset="0" stop-color="#2a576e"/><stop offset="1" stop-color="#10222c"/>
    </radialGradient>
  </defs>

  <!-- ===== ROOM ===== -->
  <rect width="720" height="1280" fill="url(#wallV)"/>
  <rect width="720" height="1280" fill="url(#topLight)"/>
  <!-- implied corner shading on the sides for a 3D room feel -->
  <rect width="720" height="1280" fill="url(#cornerShade)"/>
  <rect width="720" height="1280" fill="url(#cornerShadeR)"/>

  <!-- floor -->
  <rect x="0" y="828" width="720" height="6" fill="#aab1ba" opacity="0.7"/>
  <polygon points="0,832 720,832 720,1280 0,1280" fill="url(#floorV)"/>
  <polygon points="0,832 720,832 720,1280 0,1280" fill="url(#floorGlow)"/>
  <g stroke="#9aa2ac" stroke-width="2" opacity="0.18">
    <line x1="150" y1="832" x2="-40" y2="1280"/><line x1="320" y1="832" x2="250" y2="1280"/>
    <line x1="400" y1="832" x2="470" y2="1280"/><line x1="570" y1="832" x2="760" y2="1280"/>
  </g>

  <!-- vignette over the room (desk stays bright in center) -->
  <rect width="720" height="1280" fill="url(#vignette)"/>

  <!-- soft contact shadow on the floor under the desk -->
  <ellipse cx="362" cy="1086" rx="300" ry="58" fill="url(#contact)"/>

  <!-- navigation arrows -->
  <g>
    <g stroke="#48535f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
      <polyline points="58,624 32,656 58,688"/>
      <polyline points="662,624 688,656 662,688"/>
    </g>
  </g>

  <!-- ===== DESK ===== -->
  <!-- legs (right side) -->
  <ellipse cx="592" cy="1086" rx="42" ry="10" fill="#000" opacity="0.12"/>
  <ellipse cx="502" cy="956" rx="34" ry="8" fill="#000" opacity="0.10"/>
  <polygon points="602,664 574,664 582,1082 610,1082" fill="url(#legMetal)"/>
  <polygon points="514,556 492,556 488,952 510,952" fill="url(#legMetal)"/>
  <polygon points="588,1004 506,924 498,940 580,1022" fill="#aab2bb"/>
  <polygon points="588,690 512,584 506,598 582,704" fill="#c3c9d0"/>

  <!-- left drawer pedestal -->
  <polygon points="346,686 360,700 360,1066 346,1078" fill="url(#pedSide)"/>
  <rect x="150" y="686" width="196" height="392" rx="3" fill="url(#ped)" stroke="#cfd4da" stroke-width="2"/>
  <!-- drawers -->
  <rect x="162" y="700" width="172" height="84" rx="6" fill="url(#drawerFace)" stroke="#d2d7dd" stroke-width="2"/>
  <rect x="220" y="736" width="56" height="11" rx="5.5" fill="url(#metal)"/>
  <rect x="162" y="794" width="172" height="84" rx="6" fill="url(#drawerFace)" stroke="#d2d7dd" stroke-width="2"/>
  <rect x="220" y="830" width="56" height="11" rx="5.5" fill="url(#metal)"/>
  <rect x="162" y="888" width="172" height="178" rx="6" fill="url(#drawerFace)" stroke="#d2d7dd" stroke-width="2"/>
  <rect x="288" y="930" width="44" height="10" rx="5" fill="url(#metal)"/>
  <!-- bottom drawer: compact keypad lock, set to the left (not centered) -->
  <rect x="182" y="930" width="64" height="82" rx="9" fill="#222a32" stroke="#39434d" stroke-width="2"/>
  <rect x="182" y="930" width="64" height="82" rx="9" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.10"/>
  <rect x="189" y="938" width="50" height="14" rx="3" fill="#0c252e"/>
  <text x="214" y="949" font-family="Chakra Petch, monospace" font-size="9" fill="#5fd6e6" text-anchor="middle" letter-spacing="3">----</text>
  <g fill="#cfd4da">
    <circle cx="200" cy="972" r="3.4"/><circle cx="214" cy="972" r="3.4"/><circle cx="228" cy="972" r="3.4"/>
    <circle cx="200" cy="990" r="3.4"/><circle cx="214" cy="990" r="3.4"/><circle cx="228" cy="990" r="3.4"/>
  </g>

  <!-- desktop slab -->
  <polygon points="96,636 202,520 202,556 96,672" fill="url(#deskSideL)"/>
  <polygon points="624,636 518,520 518,556 624,672" fill="url(#deskSideR)"/>
  <rect x="96" y="636" width="528" height="36" fill="url(#deskEdge)"/>
  <rect x="96" y="636" width="528" height="3" fill="#ffffff" opacity="0.85"/>
  <polygon points="202,520 518,520 624,636 96,636" fill="url(#deskTop)" stroke="#d6dbe1" stroke-width="2"/>
  <!-- glossy reflection band on the top -->
  <polygon points="214,532 372,532 322,560 188,560" fill="#ffffff" opacity="0.45"/>
  <polygon points="202,520 518,520 524,530 196,530" fill="#ffffff" opacity="0.7"/>
  <!-- AO where pedestal meets the underside of the top -->
  <rect x="150" y="636" width="196" height="14" fill="#3b424c" opacity="0.16"/>

  <!-- monitor -->
  <ellipse cx="300" cy="560" rx="62" ry="10" fill="#000" opacity="0.16"/>
  <rect x="291" y="520" width="18" height="42" rx="3" fill="#c2c8cf"/>
  <rect x="282" y="556" width="36" height="10" rx="4" fill="#aeb5bd"/>
  <rect x="228" y="398" width="144" height="130" rx="10" fill="#2c333b" stroke="#20262d" stroke-width="2"/>
  <rect x="240" y="410" width="120" height="106" rx="4" fill="url(#screen)"/>
  <!-- faint on-screen dialog (computer is on) -->
  <rect x="262" y="430" width="76" height="50" rx="4" fill="#13303d" stroke="#2f5e74" stroke-width="1.5" opacity="0.9"/>
  <rect x="262" y="430" width="76" height="14" rx="4" fill="#2f5e74" opacity="0.85"/>
  <rect x="270" y="452" width="60" height="5" rx="2.5" fill="#4a8aa3"/>
  <rect x="270" y="462" width="44" height="5" rx="2.5" fill="#356b80"/>
  <polygon points="246,414 300,414 266,512 246,512" fill="#ffffff" opacity="0.05"/>

  <!-- keyboard + mouse -->
  <polygon points="384,604 506,604 522,628 372,628" fill="#eef1f4" stroke="#cdd3d9" stroke-width="1.5"/>
  <g fill="#cdd3d9"><rect x="392" y="609" width="118" height="5" rx="2"/><rect x="388" y="617" width="124" height="5" rx="2"/></g>
  <ellipse cx="556" cy="616" rx="15" ry="20" fill="#eef1f4" stroke="#cdd3d9" stroke-width="1.5"/>
  <line x1="556" y1="606" x2="556" y2="616" stroke="#cdd3d9" stroke-width="1.5"/>

  <!-- sticky note (examine clue) -->
  <g transform="rotate(-5 300 592)">
    <rect x="250" y="546" width="104" height="94" rx="3" fill="#ffe98a"/>
    <polygon points="250,546 270,546 250,566" fill="#fff4bf"/>
    <rect x="250" y="546" width="104" height="94" rx="3" fill="none" stroke="#f4d96a" stroke-width="1.5"/>
    <line x1="268" y1="576" x2="338" y2="576" stroke="#a9863a" stroke-width="3" stroke-linecap="round"/>
    <line x1="268" y1="596" x2="330" y2="596" stroke="#a9863a" stroke-width="3" stroke-linecap="round"/>
    <line x1="268" y1="616" x2="314" y2="616" stroke="#a9863a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
